name: Validation

# Static checks run for every fork and pull request, without a Salesforce org:
# the code review (Code Analyzer, Prettier, ESLint) and the LWC unit tests of
# the SFDX project with the DevOps Starter Kit's building blocks, the docs site
# build, plus lint, unit tests, production build and Playwright end-to-end tests
# of both UI bundles. The end-to-end tests run against the static builds, so
# games are fully playable while data calls fail gracefully.
#
# Org Validation adds a deployment and the Apex tests in a fresh scratch org. It
# needs the Dev Hub login, so it runs on pull requests from this repository and
# by hand, not for forks. Needs the same secrets and variable as the Scratch
# Org Setup workflow, which remains the full acceptance of a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  project:
    name: SFDX Project & LWC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Exercises the zod schema the org setup script relies on, so dependency
      # updates that break `npm run setup` fail here instead of in a user's org.
      - name: Validate Org Setup Config
        run: npm run validate:org-setup-config

      # Code Analyzer runs as an SF CLI plugin.
      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.2.0
        with:
          version: ${{ vars.SF_CLI_VERSION_OVERRIDE }}

      # Code Analyzer covers Apex and LWC; the UI bundles have linters of their
      # own in the jobs below. Findings below High are reported, not blocking.
      - name: Code Review
        uses: svierk/sfdx-code-review@v1.1.1
        with:
          workspace: |
            force-app/main/default/classes
            force-app/main/default/lwc
          severity-threshold: High
          prettier: true
          prettier-command: npm run prettier:verify
          eslint: true
          eslint-command: npx eslint --no-error-on-unmatched-pattern "**/{aura,lwc}/**/*.js" --format json --output-file eslint-report.json

      - name: Run LWC Unit Tests
        uses: svierk/sfdx-run-tests@v1.4.0
        with:
          apex: false
          lwc: true
          lwc-test-command: npm run test:unit:coverage

      # The Docs workflow deploys the site from main only; building it here
      # catches dead links and broken pages before the merge.
      - name: Build Docs
        run: npm run test:docs && npm run docs:build

  cabinet:
    name: Pixel Cabinet (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: force-app/main/default/uiBundles/pixelCabinet
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Node Version
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}
          path: force-app/main/default/uiBundles/pixelCabinet

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # The runner image already ships the system libraries Chromium needs, so
      # --with-deps (an apt install that can take minutes on a slow mirror) is
      # left out. The browser itself is cached per Playwright version.
      - name: Get Playwright Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run End-to-End Tests
        run: npm run build:e2e && npx playwright test --reporter=line

  hub:
    name: Polyglot Arcade Hub (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: force-app/main/default/uiBundles/polyglotArcade
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Node Version
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}
          path: force-app/main/default/uiBundles/polyglotArcade

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Build
        run: npm run build

      - name: Run Unit Tests
        run: npx ng test --watch=false

      # The runner image already ships the system libraries Chromium needs, so
      # --with-deps (an apt install that can take minutes on a slow mirror) is
      # left out. The browser itself is cached per Playwright version.
      - name: Get Playwright Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run End-to-End Tests
        run: npm run build:e2e && npx playwright test --reporter=line

  # A pull request from a fork has no access to the secrets, so it stays with
  # the static jobs. Dependabot and pushes to main stay out as well: each run
  # takes a scratch org from the Dev Hub's daily limit, a dependency update does
  # not change the Apex, and a merged change has already passed here.
  org-validation:
    name: Org Validation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    # New pushes wait instead of cancelling: a cancelled run has already used
    # up its scratch org.
    concurrency:
      group: org-validation-${{ github.ref }}
      cancel-in-progress: false
    uses: svierk/salesforce-devops-starter-kit/.github/workflows/scratch-org-ci.yml@v1.8.0
    with:
      build-script: build:ui-bundles
      deploy-agents: false # the Arcade Host lives in agent/ and is part of the acceptance
      permission-sets: polyglotArcade_Access # the tests write arcade records as the running user, as after `npm run setup`
    secrets:
      SFDX_CONSUMER_KEY: ${{ secrets.SFDX_CONSUMER_KEY }}
      SFDX_JWT_SECRET_KEY: ${{ secrets.SFDX_JWT_SECRET_KEY }}
      SFDX_USERNAME: ${{ vars.SFDX_USERNAME }}

  # The name of a reusable workflow's check differs between a run and a skip,
  # so a required check on it would wait forever on forks and Dependabot. This
  # job always reports under one name and passes when the validation was skipped.
  org-checks:
    name: Org Checks
    needs: org-validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Org Validation
        env:
          RESULT: ${{ needs.org-validation.result }}
        run: |
          echo "Org Validation: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
