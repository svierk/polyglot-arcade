name: Validation

# Validates every change without a Salesforce org: formatting, linting and the
# LWC unit tests of the SFDX project, plus lint, unit tests, production build and
# Playwright end-to-end tests of both UI bundles. The end-to-end tests run against
# the static builds, so games are fully playable while data calls fail gracefully.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  project:
    name: SFDX Project & LWC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run prettier:verify

      # Exercises the zod schema the org setup script relies on, so dependency
      # updates that break `npm run setup` fail here instead of in a user's org.
      - name: Validate Org Setup Config
        run: npm run validate:org-setup-config

      - name: Lint LWC
        run: npm run lint

      - name: Run LWC Unit Tests
        run: npm run test:unit

  cabinet:
    name: Pixel Cabinet (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: force-app/main/default/uiBundles/pixelCabinet
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}
          path: force-app/main/default/uiBundles/pixelCabinet

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Tests
        run: npm run build:e2e && npx playwright test --reporter=line

  hub:
    name: Polyglot Arcade Hub (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: force-app/main/default/uiBundles/polyglotArcade
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}
          path: force-app/main/default/uiBundles/polyglotArcade

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Build
        run: npm run build

      - name: Run Unit Tests
        run: npx ng test --watch=false

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Tests
        run: npm run build:e2e && npx playwright test --reporter=line
