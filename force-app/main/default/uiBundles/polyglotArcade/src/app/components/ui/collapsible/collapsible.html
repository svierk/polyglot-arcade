<div
  hlmCollapsible
  [expanded]="open()"
  [disabled]="disabled()"
  (expandedChange)="open.set($event)"
  class="rounded-[12px] bg-card shadow-md overflow-hidden"
>
  <button
    hlmCollapsibleTrigger
    type="button"
    class="flex w-full items-center justify-between px-6 min-h-12 font-medium transition-[min-height,background-color] duration-225 rounded-[inherit] disabled:pointer-events-none disabled:text-foreground/[0.38]"
    [class.min-h-16]="open()"
    [disabled]="disabled()"
  >
    <span class="flex flex-1 items-center overflow-hidden">
      @if (title()) {
        <span>{{ title() }}</span>
      } @else {
        <ng-content select="[collapsibleHeader]" />
      }
    </span>
    <svg
      class="size-6 shrink-0 transition-transform duration-225 fill-foreground/60"
      [class.rotate-180]="open()"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 -960 960 960"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z" />
    </svg>
  </button>
  <div hlmCollapsibleContent>
    <div class="px-6 pb-4">
      <ng-content />
    </div>
  </div>
</div>
