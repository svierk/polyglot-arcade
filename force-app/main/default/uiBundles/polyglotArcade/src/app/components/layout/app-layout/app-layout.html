<div class="arcade-shell min-h-screen">
  <header class="arcade-marquee">
    <nav
      class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-4"
      aria-label="Arcade"
    >
      @if (!onLobby()) {
        <a routerLink="/" class="arcade-nav-link">← Lobby</a>
      }
      <a routerLink="/" class="arcade-logo">Polyglot Arcade</a>
      <a routerLink="/leaderboard" class="arcade-nav-link" routerLinkActive="arcade-nav-link-active"
        >Hall of fame</a
      >
      <span class="arcade-tech-badge">Angular · Polyglot Arcade hub</span>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
  <footer class="arcade-hint px-4 pb-6 text-center">
    Angular UI bundle · Salesforce Multi-Framework · Pixel Cabinet runs on React, Snake on LWC OSS
    @if (floorUrl || player()) {
      <div class="arcade-footer-row">
        @if (floorUrl) {
          <a
            [href]="floorUrl"
            target="_top"
            class="arcade-nav-link arcade-nav-floor"
            title="Open the Arcade Floor app in Salesforce"
            >Salesforce ↗</a
          >
        }
        @if (player(); as name) {
          <span class="arcade-player">{{ name }}</span>
          <a [href]="logoutUrl" class="arcade-nav-link">Log out</a>
        }
      </div>
    }
  </footer>
</div>
