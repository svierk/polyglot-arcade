<div class="arcade-shell min-h-screen">
  <header class="border-b border-white/10">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-4">
      <a routerLink="/" class="arcade-logo mr-auto">Polyglot Arcade</a>
      <a
        routerLink="/"
        class="arcade-nav-link"
        routerLinkActive="arcade-nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Lobby</a
      >
      <a routerLink="/leaderboard" class="arcade-nav-link" routerLinkActive="arcade-nav-link-active"
        >Hall of fame</a
      >
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
  <footer class="arcade-hint px-4 pb-6 text-center">
    Angular UI bundle · Salesforce Multi-Framework · Pixel Cabinet runs on React, Snake on LWC OSS
  </footer>
</div>
