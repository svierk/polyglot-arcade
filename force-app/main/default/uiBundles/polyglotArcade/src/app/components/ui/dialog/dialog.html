<hlm-dialog
  [state]="open() ? 'open' : 'closed'"
  [disableClose]="!closeOnBackdrop()"
  [aria-label]="ariaLabel()"
  [aria-labelledby]="ariaLabelledby()"
  (stateChanged)="onStateChanged($event)"
>
  <button hlmDialogTrigger type="button" class="hidden" aria-label="Open dialog"></button>
  <hlm-dialog-content *hlmDialogPortal>
    <div hlmDialogHeader>
      <ng-content select="[header]" />
    </div>
    <div class="text-sm">
      <ng-content />
    </div>
    <div hlmDialogFooter>
      <ng-content select="[footer]" />
    </div>
  </hlm-dialog-content>
</hlm-dialog>
