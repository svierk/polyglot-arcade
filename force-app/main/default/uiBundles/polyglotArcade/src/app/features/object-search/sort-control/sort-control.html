<div class="flex items-center gap-2">
	<span class="text-sm text-muted-foreground whitespace-nowrap">{{ label() }}</span>
	<app-select
		class="w-[160px]"
		[options]="options()"
		[value]="selectedValue()"
		(valueChange)="onFieldChange($event)"
		placeholder="Default"
	/>
	@if (sort(); as active) {
	<app-button
		appearance="text"
		size="icon-sm"
		[ariaLabel]="'Sort ' + (active.direction === 'ASC' ? 'descending' : 'ascending')"
		(clicked)="toggleDirection()"
	>
		@if (active.direction === "ASC") {
		<app-icon name="arrowUp" />
		} @else {
		<app-icon name="arrowDown" />
		}
	</app-button>
	}
</div>
