<app-filter-field-wrapper [helpText]="config().helpText">
	<app-date-range-picker
		class="w-full"
		[label]="config().label"
		startPlaceholder="Start"
		endPlaceholder="End"
		[readonly]="true"
		[max]="maxDate()"
		[value]="range()"
		(valueChange)="onRangeChange($event)"
	/>
</app-filter-field-wrapper>
