<div class="space-y-1">
	@if (label()) {
	<app-label [for]="htmlFor()">{{ label() }}</app-label>
	}
	<ng-content />
	<div class="min-h-4">
		@if (error(); as err) {
		<p class="text-xs text-red-600" role="alert">{{ err }}</p>
		} @else if (helpText(); as help) {
		<p class="text-xs text-gray-500">{{ help }}</p>
		}
	</div>
</div>
