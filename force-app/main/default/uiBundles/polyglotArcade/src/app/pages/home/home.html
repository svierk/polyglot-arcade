<main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
	<div class="flex items-center gap-6 mb-6">
		<h1 class="text-2xl font-bold">Account Search</h1>
		<app-button appearance="outlined" size="sm" (clicked)="browseAll()"
			>Browse All Accounts</app-button
		>
	</div>
	<form class="flex gap-2 items-end" (submit)="onSubmit($event)">
		<app-search-bar
			class="flex-1"
			placeholder="Search by name, phone, or industry..."
			ariaLabel="Search accounts"
			[(value)]="term"
		/>
		<app-button type="submit" [disabled]="!canSearch()">Search</app-button>
	</form>
</main>
