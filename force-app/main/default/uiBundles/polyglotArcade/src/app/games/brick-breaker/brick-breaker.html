<div class="flex flex-col items-center gap-3">
  <div class="hud" aria-live="polite">
    <span class="arcade-stat"
      ><span>Score</span><strong>{{ score() }}</strong></span
    >
    <span class="arcade-stat"
      ><span>Level</span><strong>{{ level() }}</strong></span
    >
    <span class="arcade-stat">
      <span>Lives</span>
      <strong class="hearts" [attr.aria-label]="lives() + ' lives left'">{{
        '♥'.repeat(lives()) || '–'
      }}</strong>
    </span>
  </div>

  <div class="relative w-full">
    <canvas
      #canvas
      class="arcade-screen board"
      [style.aspect-ratio]="field.width + ' / ' + field.height"
      (pointermove)="onPointerMove($event)"
      (pointerdown)="onPointerDown($event)"
    ></canvas>

    @switch (phase()) {
      @case ('ready') {
        <div class="arcade-overlay">
          <p class="arcade-title text-lg">Brick Breaker</p>
          <button type="button" class="arcade-button" (click)="start()">Press start</button>
        </div>
      }
      @case ('paused') {
        <div class="arcade-overlay">
          <p class="arcade-title text-lg">Paused</p>
          <button type="button" class="arcade-button" (click)="resume()">Resume</button>
        </div>
      }
      @case ('over') {
        <div class="arcade-overlay">
          <p class="arcade-title text-lg">Game over</p>
        </div>
      }
    }
  </div>

  <p class="arcade-hint">← → or the pointer move the paddle · space or click launches · P pauses</p>
</div>
