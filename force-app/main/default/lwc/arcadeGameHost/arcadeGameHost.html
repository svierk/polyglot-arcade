<template>
  <lightning-card title={title} icon-name="custom:custom48">
    <template lwc:if={hubUrl}>
      <a slot="actions" class="slds-button slds-button_neutral" href={hubUrl}
        >← Polyglot Arcade</a
      >
    </template>
    <div class="arcade-stage">
      <template for:each={embeddings} for:item="embedding">
        <lightning-ui-embedding
          key={embedding.key}
          src={embedding.src}
          sandbox="allow-scripts allow-same-origin allow-forms"
          shell-title={title}
          props={embedProps}
          ongameover={handleGameOver}
        ></lightning-ui-embedding>
      </template>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:elseif={showSetup}>
        <div class="slds-p-around_medium setup">
          <p class="slds-text-heading_small slds-m-bottom_x-small">
            Insert coin: this game is not plugged in yet.
          </p>
          <p class="slds-text-body_regular">{setupHint}</p>
        </div>
      </template>
    </div>
    <template lwc:if={pattern}>
      <div slot="footer" class="xray">
        <p class="xray-heading">
          <span class="xray-no"
            ><span class="slds-assistive-text">Pattern </span>{pattern.no}</span
          >
          {pattern.name}
        </p>
        <p class="slds-text-body_small">
          {pattern.detail}
          <a
            class="xray-link"
            href={patternsUrl}
            target="_blank"
            rel="noreferrer"
            >How it works ↗</a
          >
        </p>
      </div>
    </template>
  </lightning-card>
</template>
