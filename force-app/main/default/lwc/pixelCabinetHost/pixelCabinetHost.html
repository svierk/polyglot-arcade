<template>
  <lightning-card title={cardTitle} icon-name="custom:custom48">
    <div class="cabinet">
      <template for:each={embeddings} for:item="embedding">
        <lightning-ui-embedding
          key={embedding.key}
          src={embedding.src}
          sandbox="allow-scripts allow-same-origin allow-forms"
          shell-title={cardTitle}
          props={embedProps}
          ongameover={handleGameOver}
        ></lightning-ui-embedding>
      </template>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:elseif={showSetup}>
        <div class="slds-p-around_medium setup">
          <p class="slds-text-heading_small slds-m-bottom_x-small">
            Insert coin: the cabinet is not plugged in yet.
          </p>
          <p class="slds-text-body_regular">
            Open <strong>Pixel Cabinet</strong> from the App Launcher, copy its
            URL and either paste it into this component's
            <em>Cabinet URL</em> property or store it in the
            <em>App URL</em> field of the Block Drop game record.
          </p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
